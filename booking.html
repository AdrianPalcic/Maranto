<!DOCTYPE html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bacasime+Antique&family=Cormorant:ital,wght@0,300..700;1,300..700&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <title>Rezervacija termina | Maranto</title>
    <meta name="robots" content="noindex" />
  </head>
  <body class="mx-auto max-w-[900px] bg-white">
    <header class="flex px-6 py-4 justify-between items-center">
      <a href="/index.html" class="w-[120px] h-[80px] block">
        <img src="/logo.png" alt="Maranto logo" class="w-full h-full object-contain" />
      </a>
      <a href="/index.html#kontakt"><button>Kontakt</button></a>
    </header>

    <main class="px-6 pb-20">
      <p class="tag text-[#bc8e31] text-center">Termin</p>
      <h1 class="text-3xl sm:text-5xl text-center mb-2">Rezervirajte isprobavanje</h1>
      <p class="text-center mb-10 opacity-70">
        Ponedjeljak – petak, 12:00 – 19:00. Isprobavanje traje 1 sat.
      </p>

      <div id="loadingState" class="text-center py-10">Učitavanje termina...</div>

      <div id="bookingForm" class="hidden max-w-md mx-auto">
        <label class="block mb-1 tag text-sm">Odaberite datum</label>
        <select id="dateSelect" class="w-full border border-gray-300 p-3 mb-6"></select>

        <label class="block mb-1 tag text-sm">Odaberite vrijeme</label>
        <div id="slotButtons" class="flex flex-wrap gap-2 mb-6"></div>

        <div id="detailsForm" class="hidden">
          <label class="block mb-1 tag text-sm">Ime</label>
          <input id="firstName" class="w-full border border-gray-300 p-3 mb-4" />

          <label class="block mb-1 tag text-sm">Prezime</label>
          <input id="lastName" class="w-full border border-gray-300 p-3 mb-4" />

          <label class="block mb-1 tag text-sm">Telefon</label>
          <input id="phone" type="tel" class="w-full border border-gray-300 p-3 mb-4" />

          <label class="block mb-1 tag text-sm">Email</label>
          <input id="email" type="email" class="w-full border border-gray-300 p-3 mb-6" />

          <button id="submitBtn" class="w-full text-black">Potvrdi rezervaciju</button>
        </div>

        <p id="statusMsg" class="mt-4 text-center"></p>
      </div>

      <div id="successState" class="hidden text-center py-10">
        <h2 class="text-2xl mb-2">Rezervacija potvrđena!</h2>
        <p id="successDetails" class="mb-4"></p>
        <p class="opacity-70">Potvrda je poslana na vaš email.</p>
      </div>

      <div id="emptyState" class="hidden text-center py-10">
        <p>Trenutno nema slobodnih termina. Kontaktirajte nas izravno.</p>
      </div>
    </main>

    <script>
      let allSlots = [];
      let selectedDate = null;
      let selectedSlot = null;

      const loadingState = document.getElementById("loadingState");
      const bookingForm = document.getElementById("bookingForm");
      const emptyState = document.getElementById("emptyState");
      const successState = document.getElementById("successState");
      const dateSelect = document.getElementById("dateSelect");
      const slotButtons = document.getElementById("slotButtons");
      const detailsForm = document.getElementById("detailsForm");
      const statusMsg = document.getElementById("statusMsg");
      const submitBtn = document.getElementById("submitBtn");

      function formatDateOption(dateStr) {
        const d = new Date(dateStr + "T00:00:00");
        return d.toLocaleDateString("hr-HR", {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric",
        });
      }

      async function loadAvailability() {
        try {
          const res = await fetch("/api/availability");
          const data = await res.json();
          allSlots = data.slots || [];
        } catch (e) {
          allSlots = [];
        }

        loadingState.classList.add("hidden");

        if (!allSlots.length) {
          emptyState.classList.remove("hidden");
          return;
        }

        bookingForm.classList.remove("hidden");
        const dates = [...new Set(allSlots.map((s) => s.date))];
        dateSelect.innerHTML = dates
          .map((d) => `<option value="${d}">${formatDateOption(d)}</option>`)
          .join("");
        selectedDate = dates[0];
        renderSlots();
      }

      function renderSlots() {
        selectedSlot = null;
        detailsForm.classList.add("hidden");
        const daySlots = allSlots.filter((s) => s.date === selectedDate);
        slotButtons.innerHTML = daySlots
          .map(
            (s) =>
              `<button type="button" data-slot="${s.slotIndex}" class="!bg-transparent !text-black !border !border-solid !border-[#bc8e31] slot-btn">${s.label}</button>`
          )
          .join("");
      }

      dateSelect.addEventListener("change", () => {
        selectedDate = dateSelect.value;
        renderSlots();
      });

      slotButtons.addEventListener("click", (e) => {
        const btn = e.target.closest(".slot-btn");
        if (!btn) return;
        selectedSlot = Number(btn.dataset.slot);
        document
          .querySelectorAll(".slot-btn")
          .forEach((b) => b.classList.remove("!bg-[#bc8e31]", "!text-white"));
        btn.classList.add("!bg-[#bc8e31]", "!text-white");
        detailsForm.classList.remove("hidden");
      });

      submitBtn.addEventListener("click", async () => {
        const firstName = document.getElementById("firstName").value.trim();
        const lastName = document.getElementById("lastName").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const email = document.getElementById("email").value.trim();

        if (!firstName || !lastName || !phone || !email) {
          statusMsg.textContent = "Molimo popunite sva polja.";
          return;
        }
        if (selectedSlot === null) {
          statusMsg.textContent = "Molimo odaberite termin.";
          return;
        }

        submitBtn.disabled = true;
        statusMsg.textContent = "Slanje...";

        try {
          const res = await fetch("/api/book", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              date: selectedDate,
              slotIndex: selectedSlot,
              firstName,
              lastName,
              phone,
              email,
            }),
          });
          const data = await res.json();
          if (!res.ok) {
            statusMsg.textContent = data.error || "Došlo je do greške.";
            submitBtn.disabled = false;
            if (res.status === 409) await loadAvailability();
            return;
          }
          bookingForm.classList.add("hidden");
          successState.classList.remove("hidden");
          document.getElementById("successDetails").textContent = `${data.date}, ${data.time}`;
        } catch (e) {
          statusMsg.textContent = "Došlo je do greške. Pokušajte ponovno.";
          submitBtn.disabled = false;
        }
      });

      loadAvailability();
    </script>
  </body>
</html>
